<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erişim Merkezi</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        body { 
            background: #f4f4f9; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            font-family: sans-serif; 
        }
        .card { 
            background: white; 
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.1); 
            text-align: center; 
            width: 340px;
        }
        input { 
            padding: 12px; 
            width: 280px; 
            border: 2px solid #ddd; 
            border-radius: 8px; 
            margin-bottom: 10px; 
            text-align: center;
            font-size: 16px;
        }
        #durum { 
            font-size: 14px; 
            margin-bottom: 15px; 
            min-height: 20px;
        }
        #indirBtn { 
            display: none; 
            background: #000; 
            color: #fff; 
            padding: 12px 30px; 
            text-decoration: none; 
            border-radius: 8px; 
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Erişim Merkezi</h2>
        <input type="password" id="sifreKutusu" placeholder="Anahtarı girin..." oninput="kontrolEt()">
        <div id="durum">Anahtar bekleniyor...</div>
        <a href="https://drive.google.com/file/d/1P4MEfouNOQE5hDXxONeoHnqbuJtsdAU5/view?usp=sharing" 
           target="_blank" id="indirBtn">İndirmeyi Başlat</a>
    </div>

    <script>
        function kontrolEt() {
            const girilen = document.getElementById('sifreKutusu').value;
            const btn = document.getElementById('indirBtn');
            const durum = document.getElementById('durum');

            if (typeof CryptoJS === "undefined") {
                durum.innerText = "Yükleniyor...";
                return;
            }

            // Doğru Hash - İSTANBUL1923JX
            const dogruHash = "a1440c9d9ee754f5ac8cb372165a96ce09a4ca96e236ca6bc4f63a1fd48138de";

            try {
                const girilenHash = CryptoJS.SHA256(girilen).toString();

                if (girilenHash === dogruHash) {
                    btn.style.display = "inline-block";
                    durum.innerText = "Erişim sağlandı! ✅";
                    durum.style.color = "green";
                } else {
                    btn.style.display = "none";
                    durum.style.color = "#d32f2f";
                    durum.innerText = girilen.length > 0 ? "Hatalı anahtar." : "Anahtar bekleniyor...";
                }
            } catch (e) {
                durum.innerText = "Bir hata oluştu.";
            }
        }

        // Sayfa açıldığında şifre kutusuna odaklan
        window.onload = () => {
            document.getElementById('sifreKutusu').focus();
        };
    </script>
</body>
</html>
